<script type="application/json" id="story-data">{"nodes":[{"id":"start","chapter":"序章 · 照片里的录取","location":"紫金港校史馆","date":"2026 年 10 月","bg":"IMG-01","type":"text","text":"你是浙江大学的一名大一新生。\n\n2026 年 10 月，校史馆（紫金港月牙楼）举办“文军长征”特展，你作为志愿者被分去辅助工作。","next":"scene-002"},{"id":"scene-002","chapter":"序章 · 照片里的录取","location":"紫金港校史馆","date":"2026 年 10 月","bg":"IMG-01","type":"text","text":"你带着一根按动笔、一本手账本，走进展厅。玻璃后面，是一段被时间封存的西行。\n\n——然后，你碰了不该碰的东西。","next":"interaction-1"},{"id":"interaction-1","chapter":"序章 · 照片里的录取","location":"紫金港校史馆","date":"2026 年 10 月","bg":"IMG-01","type":"exhibits","text":"在展厅里查看四件展品。先读完箱子、合影和日记的故事，再点开护送路线图。","next":"scene-004"},{"id":"scene-004","chapter":"序章 · 照片里的录取","location":"紫金港校史馆","date":"2026 年 10 月","bg":"IMG-24","type":"text","text":"你最后点开路线图，手指沿着西迁路线移动。\n\n当年西迁好艰苦啊！\n\n手指回到杭州，视线忽然被这个地名吸住。白光一闪，传来一声快门。","next":"scene-005"},{"id":"scene-005","chapter":"序章 · 照片里的录取","location":"紫金港校史馆","date":"2026 年 10 月","bg":"IMG-24","type":"text","text":"你被录取了。八十九年前。","speaker":"字幕","journal":{"id":"museum","title":"照片里的录取","text":"2026，校史馆。竺可桢校长的日记手稿，把我扔进烽火连天的一九三七。"},"next":"chapter1-start"},{"id":"chapter1-start","chapter":"第一章 · 烽火开学","location":"杭州 · 国立浙江大学校门","date":"1937 年 9 月","bg":"IMG-02","type":"text","text":"报纸号外飞落：七七事变、八一三淞沪会战。街上逃难的人挑着担子往南站。米价牌上的数字被人一次次改写。\n\n民国二十六年，七月卢沟桥，八月上海。杭州的桂花照开，可报童喊的已经不是桂花的事了。","next":"scene-007"},{"id":"scene-007","chapter":"第一章 · 烽火开学","location":"杭州 · 国立浙江大学校门","date":"1937 年 9 月","bg":"IMG-02","type":"text","text":"杭州，国立浙江大学校门口。你落在校门口，手里捏着一张录取通知书，上面写着你的名字。","next":"scene-008"},{"id":"scene-008","chapter":"第一章 · 烽火开学","location":"杭州 · 国立浙江大学校门","date":"1937 年 9 月","bg":"IMG-02","type":"text","text":"新生？新生不上这儿报到——一年级迁天目山了，禅源寺。喏，路上吃。","speaker":"门房","next":"interaction-2"},{"id":"interaction-2","chapter":"第一章 · 烽火开学","location":"杭州 · 国立浙江大学校门","date":"1937 年 9 月","bg":"IMG-02","type":"action","text":"门房递来两个烧饼。你伸出手，接下这段陌生路上的第一份照应。","button":"接过烧饼 × 2","journal":{"id":"biscuits","title":"路上的干粮","text":"1937 年的烧饼，有点硬。"},"next":"scene-010"},{"id":"scene-010","chapter":"第一章 · 烽火开学","location":"去往西天目山的山路","date":"1937 年 9 月","bg":"IMG-03","type":"text","text":"去天目山的独轮车上，同车有两人。\n\n陈砚秋是土木工程系新生，绍兴人，抱着一个布包着的测量水准仪，不许别人碰。\n\n何九章是中文系二年级，建德人，怀里一把二胡。","next":"scene-011"},{"id":"scene-011","chapter":"第一章 · 烽火开学","location":"去往西天目山的山路","date":"1937 年 9 月","bg":"IMG-03","type":"text","text":"喂，新生。你这笔——\n\n（她盯着你的口袋）","speaker":"陈砚秋","next":"scene-012"},{"id":"scene-012","chapter":"第一章 · 烽火开学","location":"去往西天目山的山路","date":"1937 年 9 月","bg":"IMG-03","type":"text","text":"你回头看向口袋，口袋中竟然还有现代的按动中性笔？","next":"scene-013"},{"id":"scene-013","chapter":"第一章 · 烽火开学","location":"去往西天目山的山路","date":"1937 年 9 月","bg":"IMG-03","type":"text","text":"——按一下就出水的？给我看看。","speaker":"陈砚秋","next":"interaction-3"},{"id":"interaction-3","chapter":"第一章 · 烽火开学","location":"去往西天目山的山路","date":"1937 年 9 月","bg":"IMG-03","type":"choice","text":"陈砚秋向你伸出手。你决定——","choices":[{"id":"lend","text":"递给她看看","feedback":"她按了三下，还给你：“好笔。等到了天目山，借我画三天图纸。”","effects":{"renxin":1},"next":"scene-015"},{"id":"keep","text":"把笔收好，暂时不递","feedback":"她撇了撇嘴：“小气。”","effects":{},"next":"scene-015"}],"next":"scene-015"},{"id":"scene-015","chapter":"第一章 · 烽火开学","location":"去往西天目山的山路","date":"1937 年 9 月","bg":"IMG-03","type":"text","text":"别理她。我叫何九章，九章算术的九章。你呢？","speaker":"何九章","next":"name-confirm"},{"id":"name-confirm","chapter":"第一章 · 烽火开学","location":"去往西天目山的山路","date":"1937 年 9 月","bg":"IMG-03","type":"nameConfirm","text":"我的名字是……","next":"scene-017","speaker":"你"},{"id":"scene-017","chapter":"第一章 · 烽火开学","location":"去往西天目山的山路","date":"1937 年 9 月","bg":"IMG-03","type":"text","text":"{name}。记住了。山路还长，咱们一起走。","speaker":"何九章","next":"scene-018"},{"id":"scene-018","chapter":"第一章 · 烽火开学","location":"西天目山 · 禅源寺","date":"1937 年 9 月 21 日","bg":"IMG-04","type":"text","text":"千年银杏，寺墙斑驳。妙定方丈收下了这批借宿的师生，僧人帮忙搬黑板。\n\n你的铺位就在余屋里。","next":"interaction-4"},{"id":"interaction-4","chapter":"第一章 · 烽火开学","location":"西天目山 · 禅源寺","date":"1937 年 9 月 21 日","bg":"IMG-04","type":"action","text":"放好行李，把书本留在伸手能拿到的地方。这里将是你暂时的家。","button":"放好行李","next":"scene-020"},{"id":"scene-020","chapter":"第一章 · 烽火开学","location":"西天目山 · 禅源寺","date":"1937 年 9 月 27 日","bg":"IMG-04","type":"text","text":"9 月 27 日，开学第一课。没有礼堂，大殿前的院子就是课堂。\n\n钟声响起时，山下隐约有闷雷滚过——僧人说是山雨。","next":"scene-021"},{"id":"scene-021","chapter":"第一章 · 烽火开学","location":"西天目山 · 禅源寺","date":"1937 年 9 月 27 日","bg":"IMG-04","type":"text","text":"（低声）\n是炮。","speaker":"何九章","journal":{"id":"temple","title":"钟声与炮声","text":"1937.9.27 天目山禅源寺。一座庙，开学的钟声和远处的炮声一起响。"},"next":"chapter2-news"},{"chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","id":"chapter2-news","type":"text","text":"11 月 5 日日军在杭州湾登陆的消息传开；街上人挤人，惊呼声与讨论声不绝于耳。","next":"chapter2-start"},{"id":"chapter2-start","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"十一月五号，日本人在全公亭登陆。学校布告贴出来：全校迁建德，水路，分批启程。","speaker":"何九章","next":"scene-023"},{"id":"scene-023","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"步行途中，暮色，山风卷着枯叶。队伍沿路跋涉，背着书籍、行囊，队伍拉得很长。","next":"scene-024"},{"id":"scene-024","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"（回头，压低声音）\n{name}，跟上些，前面转过山坳就有歇脚的平地。天快黑了，要赶在入夜前到达。","speaker":"陈砚秋","next":"scene-025"},{"id":"scene-025","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"你正要应声，正要迈步，听见路边枯草堆里传来极轻的抽噎声。","next":"scene-026"},{"id":"scene-026","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"（放轻脚步）\n你听。","speaker":"{name}","next":"scene-027"},{"id":"scene-027","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"两人拨开枯黄的茅草，看见蜷缩在土坡下的小女孩。小女孩头发凌乱，裤脚划破，脚上的布鞋磨破了洞，看见来人，吓得往后缩，紧紧把包袱搂在胸前。","next":"scene-028"},{"id":"scene-028","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"（放缓语调，慢慢蹲下身，不靠近）\n小朋友，别怕，我们是学生，不是坏人。你叫什么名字？","speaker":"陈砚秋","next":"scene-029"},{"id":"scene-029","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"（嘴唇哆嗦，声音细若蚊蚋）\n小……小，小满。","speaker":"小满","next":"scene-030"},{"id":"scene-030","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"（轻声）\n小满，你一个人在这里？你的爹娘呢？","speaker":"{name}","next":"scene-031"},{"id":"scene-031","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"（眼泪一下子滚下来）\n路上…… 走散了。炮响的时候，娘把我推到草丛里。等我再出来，就找不到他们了。\n\n（把怀里的布包抱紧，里面是半块干硬的麦饼）\n我跟着逃难的人走，走不动，掉队了。","speaker":"小满","next":"scene-032"},{"id":"scene-032","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"山风掠过江面，远处隐约传来隆隆闷响。陈砚秋解下自己背上的粗布干粮袋，拿出一小块饼递过去。小满盯着干粮，不敢伸手。","next":"scene-033"},{"id":"scene-033","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"拿着吃吧。","speaker":"陈砚秋","next":"scene-034"},{"id":"scene-034","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"（怯生生抬头，看向长长的队伍，看到大家背着书本仪器）\n你们…… 要去哪里？","speaker":"小满","next":"scene-035"},{"id":"scene-035","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"我们带着学校的书，往建德去。战火来了，可读书不能断。","speaker":"陈砚秋","next":"scene-036"},{"id":"scene-036","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"（小声）\n我能不能…… 跟你们一起走？我能捡柴，能帮着拿轻东西，我不拖累你们。","speaker":"小满","next":"scene-036-pause"},{"id":"scene-036-pause","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"你们面面相觑，沉默片刻。","next":"scene-037"},{"id":"scene-037","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"国难路上，没有人该被丢下。只是前路很苦，还要继续赶路。","speaker":"{name}","next":"scene-038"},{"id":"scene-038","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"（用力点头，抹掉泪水，撑着地面站起来）\n我能走！我叫小满，我会好好跟着队伍。","speaker":"小满","next":"scene-039"},{"id":"scene-039","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"陈砚秋伸手，小心牵住小满冻得冰凉的小手，带着她追上前行的队伍。前方，师生们的身影在暮色里向着建德方向绵延而去。","next":"scene-040"},{"id":"scene-040","chapter":"第二章 · 夜渡钱塘","location":"天目山 → 建德梅城","date":"1937 年 11 月","bg":"IMG-03","type":"text","text":"（低声对小满）\n跟着我们，前面，会有灯火。","speaker":"{name}","next":"scene-041"},{"id":"scene-041","chapter":"第二章 · 夜渡钱塘","location":"建德梅城","date":"1937 年 11—12 月","bg":"IMG-05","type":"text","text":"富春江边的古城，城墙上有防空哨。白天上课，黄昏警报一响，师生把黑板抬进祠堂深处接着讲。","next":"scene-042"},{"id":"scene-042","chapter":"第二章 · 夜渡钱塘","location":"建德梅城","date":"1937 年 11—12 月","bg":"IMG-05","type":"text","text":"在孙宅门口，你第一次近距离见到竺可桢校长。他正蹲着给脚上的水泡挑破。","next":"scene-043"},{"id":"scene-043","chapter":"第二章 · 夜渡钱塘","location":"建德梅城","date":"1937 年 11—12 月","bg":"IMG-05","type":"text","text":"新生？天目山下来的？\n\n（他抬头看你一眼）\n脚上的泡，挑破了才好走路。学校也一样——疼一下，接着走。","speaker":"竺可桢","next":"scene-044"},{"id":"scene-044","chapter":"第二章 · 夜渡钱塘","location":"建德 · 古籍仓房","date":"1937 年 11—12 月","bg":"IMG-06","type":"text","text":"深夜，木箱摞到房梁。图书馆员开箱验潮，你在旁边打下手。这些书，是随学校一起西行的文澜阁《四库全书》。","next":"scene-045"},{"id":"scene-045","chapter":"第二章 · 夜渡钱塘","location":"建德 · 古籍仓房","date":"1937 年 11—12 月","bg":"IMG-06","type":"text","text":"乾隆年间抄的，太平军进城那年散过一回，一页一页赎回来补的。杭州人守了它一百年。","speaker":"图书馆员","next":"scene-046"},{"id":"scene-046","chapter":"第二章 · 夜渡钱塘","location":"建德 · 古籍仓房","date":"1937 年 11—12 月","bg":"IMG-06","type":"text","text":"（他把一函书递给你）\n小心点，别掉了。","speaker":"图书馆员","next":"choice-1"},{"id":"choice-1","chapter":"第二章 · 夜渡钱塘","location":"建德 · 古籍仓房","date":"1937 年 11—12 月","bg":"IMG-06","type":"choice","text":"学校征学生义工，随押运队送书往内地。你要报名吗？","choices":[{"id":"protect","text":"报名，跟书走","feedback":"你把名字写进名单。此后的西行，你还要照应这些书卷。","effects":{"xinhuo":1,"protectBooks":true,"bookIntegrity":1},"next":"scene-048"},{"id":"school","text":"不报名，留在学校，随校继续迁往泰和","feedback":"你留在学校，继续课程，跟随师生一起迁移。","effects":{"qiuzhen":1,"protectBooks":false,"bookIntegrity":null},"next":"scene-048"}],"next":"scene-048"},{"id":"scene-048","chapter":"第二章 · 夜渡钱塘","location":"建德梅城","date":"1937 年 12 月 24 日","bg":"IMG-05","type":"text","text":"12 月 24 日，杭州陷落。梅城戒严，城墙上的灯笼一夜全灭。","next":"scene-049"},{"id":"scene-049","chapter":"第二章 · 夜渡钱塘","location":"建德梅城","date":"1937 年 12 月 24 日","bg":"IMG-05","type":"text","text":"十二月二十四，杭州没了。我们在梅城的严子陵祠落脚。严先生当年不肯做官，躲到江边钓鱼；我们不一样，我们是躲着，还要把书念完。","speaker":"何九章","journal":{"id":"meicheng","title":"文脉西运","text":"1937.11 建德梅城。警报声声，我们躲着战火，捧着古书，要把文脉一路护往内地。"},"next":"scene-050"},{"id":"scene-050","chapter":"第二章 · 夜渡钱塘","location":"学生宿舍","date":"1937 年底","bg":"IMG-07","type":"text","text":"你铺位旁边的铺盖已经卷好了，用麻绳捆得方方正正。周念东蹲在地上，往包袱里塞最后一样东西——是他那本《物理学概论》，塞到一半，又抽出来，放回桌上。","next":"scene-051"},{"id":"scene-051","chapter":"第二章 · 夜渡钱塘","location":"学生宿舍","date":"1937 年底","bg":"IMG-07","type":"text","text":"书带不动了。留着给你。","speaker":"周念东","next":"scene-052"},{"id":"scene-052","chapter":"第二章 · 夜渡钱塘","location":"学生宿舍","date":"1937 年底","bg":"IMG-07","type":"text","text":"你真要走？","speaker":"{name}","next":"scene-053"},{"id":"scene-053","chapter":"第二章 · 夜渡钱塘","location":"学生宿舍","date":"1937 年底","bg":"IMG-07","type":"text","text":"（他顿了顿，声音低下去）\n我昨晚想了一宿。国家有难，我要去参军保家卫国。……你要不要一起来？","speaker":"周念东","next":"choice-2"},{"id":"choice-2","chapter":"第二章 · 夜渡钱塘","location":"学生宿舍","date":"1937 年底","bg":"IMG-07","type":"choice","text":"周念东等着你的回答。","choices":[{"id":"stay","text":"仗有人打，书也要有人读。留下来。","feedback":"他盯着你看了一会儿，把桌上那本《物理学概论》推给你：“那你替我把它读完。”\n\n第二天天亮，他的铺位空了。","effects":{"xinhuo":1},"journal":{"id":"army","title":"留下来","text":"我留下了。不知道他怪我，还是怪他自己没怪我。"},"next":"scene-055"},{"id":"join","text":"和他一起去。","feedback":"“我也一起去！”\n\n他愣住，然后拍了拍你的肩膀，笑了，笑得有点苦。","effects":{"renxin":1},"journal":{"id":"army","title":"替我读下去","text":"我报名了，但他拒绝。他说仗有人打，书也要人读。"},"next":"choice2-join-reply"}],"next":"scene-055"},{"chapter":"第二章 · 夜渡钱塘","location":"学生宿舍","date":"1937 年底","bg":"IMG-07","id":"choice2-join-reply","type":"text","speaker":"周念东","text":"你还是一年级新生，先在校好好学习。仗要人打，书也要人读。","next":"choice2-join-departure"},{"chapter":"第二章 · 夜渡钱塘","location":"学生宿舍","date":"1937 年底","bg":"IMG-07","id":"choice2-join-departure","type":"text","text":"他摆摆手，没让你送。第二天天亮，铺位空了。桌上压着一张纸，是那本《物理学概论》的扉页，写着一行字：\n\n“替我读下去，等我回来考试。”","next":"scene-055"},{"id":"scene-055","chapter":"第二章 · 夜渡钱塘","location":"学生宿舍","date":"1937 年底","bg":"IMG-25","type":"text","text":"1937 年底，浙江大学学生刘奎斗等 12 人投笔从戎，奔赴浙东战场。但他们出发时站过的地方，是同一个学校。","speaker":"字幕","next":"chapter3-start"},{"id":"chapter3-start","chapter":"第三章 · 文军长征","location":"建德—金华—南昌—樟树—吉安","date":"1937 年 12 月—1938 年 2 月","bg":"IMG-24","type":"text","text":"十二月二十四号，我们从建德分批启程。坐船、搭车、走路，有的从常山走到玉山。第二年一月，到了江西吉安；二月，又迁泰和。","speaker":"何九章","next":"scene-057"},{"id":"scene-057","chapter":"第三章 · 文军长征","location":"吉安 · 白鹭洲书院","date":"1938 年 1—2 月","bg":"IMG-08","type":"text","text":"借来的教室里，课程仍在继续。白鹭洲的夜色落下，你借着油灯复习。明天的考试，也没有因为迁徙停下来。","next":"interaction-5"},{"id":"interaction-5","chapter":"第三章 · 文军长征","location":"吉安 · 白鹭洲书院","date":"1938 年 1—2 月","bg":"IMG-08","type":"quiz","text":"白鹭洲夜读：完成三道单选题，再一起提交。","questions":[{"question":"竺老两问的具体内容是？","options":["到浙大来做什么？毕业要做什么样的人？","到浙大来做什么？将来毕业后要做什么样的人？","到浙大来做什么？将来毕业后要成为什么样的人？","到浙大来做什么？毕业要成为什么样的人？"],"correct":1},{"question":"浙大本部师生从哪天开始迁往建德？","options":["1937 年 11 月 5 日","1937 年 11 月 11 日","1937 年 11 月 15 日","1937 年 11 月 13 日"],"correct":1},{"question":"哪所学校是白鹭洲书院旧址？","options":["吉安乡村师范","阳明书院","净居寺","吉安中学"],"correct":3}],"next":"scene-059"},{"id":"scene-059","chapter":"第三章 · 文军长征","location":"泰和 · 赣江大堤","date":"1938 年 4—6 月","bg":"IMG-09","type":"text","text":"陈砚秋挎着测绘仪器，手里攥着图纸。你帮她扛着三脚架，一同走在泥泞河滩。你将三脚架扎进松软滩土，架设好水平仪，江面的日光反射在镜片上，晃得人不由眯起双眼。","next":"scene-060"},{"id":"scene-060","chapter":"第三章 · 文军长征","location":"泰和 · 赣江大堤","date":"1938 年 4—6 月","bg":"IMG-09","type":"text","text":"这里地基松软，三脚架一定要踩实。堤是要替泰和挡几十年水的，半分数据都马虎不得。","speaker":"陈砚秋","next":"scene-061"},{"id":"scene-061","chapter":"第三章 · 文军长征","location":"泰和 · 赣江大堤","date":"1938 年 4—6 月","bg":"IMG-09","type":"text","text":"二人俯身紧盯仪器，反复调整校正，一次次记下堤段高程读数。几番核对，一组组可靠的测量数据终于完整记录在测绘本上。\n\n陈砚秋低头落笔记下最后一组数字，指尖沾了泥土。","next":"scene-062"},{"id":"scene-062","chapter":"第三章 · 文军长征","location":"泰和 · 赣江大堤","date":"1938 年 4—6 月","bg":"IMG-09","type":"text","text":"高程若是差上几寸，汛期大水一来，田地村落便都要受淹。我们来到此地，不只是读书求学，更要做落地实在的事。去下一个测点吧。","speaker":"陈砚秋","next":"interaction-6"},{"id":"interaction-6","chapter":"第三章 · 文军长征","location":"泰和 · 赣江大堤","date":"1938 年 4—6 月","bg":"IMG-09","type":"choice","text":"在松软河滩上架设水平仪，首先应当怎么做？","choices":[{"id":"steady","text":"踩稳三脚架并复核水平","feedback":"陈砚秋点点头：“先把基础做好，数字才靠得住。”","effects":{"qiuzhen":1},"next":"scene-064"},{"id":"rush","text":"不必校准，直接记录高程","feedback":"陈砚秋让你停下：“先踩实、再复核水平。半分数据也马虎不得。”","effects":{"mistakes":1},"next":"scene-064"}],"next":"scene-064","speaker":"陈砚秋"},{"id":"scene-064","chapter":"第三章 · 文军长征","location":"泰和 · 赣江大堤","date":"1938 年 4—6 月","bg":"IMG-09","type":"text","text":"一寸一尺，你们把数据记进测绘本，也把课堂里的知识，放到了赣江边。","journal":{"id":"levee","title":"保命的大堤","text":"1938 年，泰和。赣江边跑测量，一寸一尺，修的是保命的大堤。"},"next":"scene-065"},{"id":"scene-065","chapter":"第三章 · 文军长征","location":"泰和 · 澄江学校","date":"1938 年","bg":"IMG-10","type":"text","text":"澄江学校的院子里，小满握着一把破旧竹扫帚，正帮着打扫。祠堂里传来孩童读书的声音。","next":"scene-066"},{"id":"scene-066","chapter":"第三章 · 文军长征","location":"泰和 · 澄江学校","date":"1938 年","bg":"IMG-10","type":"text","text":"小满，你想读书吗？","speaker":"{name}","next":"chengjiang-xiaoman-looks-up"},{"chapter":"第三章 · 文军长征","location":"泰和 · 澄江学校","date":"1938 年","bg":"IMG-10","id":"chengjiang-xiaoman-looks-up","type":"text","text":"小满猛地抬头，眼里有光，又很快黯淡下去。","next":"scene-067"},{"id":"scene-067","chapter":"第三章 · 文军长征","location":"泰和 · 澄江学校","date":"1938 年","bg":"IMG-10","type":"text","text":"想……可是我没有书本，也没有钱交学费。","speaker":"小满","next":"chengjiang-offer-school"},{"chapter":"第三章 · 文军长征","location":"泰和 · 澄江学校","date":"1938 年","bg":"IMG-10","id":"chengjiang-offer-school","type":"text","text":"你笑着蹲下身，指向祠堂内读书的孩童。","next":"scene-068"},{"id":"scene-068","chapter":"第三章 · 文军长征","location":"泰和 · 澄江学校","date":"1938 年","bg":"IMG-10","type":"text","text":"别担心，这里是浙大办的澄江学校。这学堂不光收教职工的孩子，乡间、逃难来的孩子也能入学，不收学费。我想送你来这里上学。","speaker":"{name}","next":"chengjiang-grip-broom"},{"chapter":"第三章 · 文军长征","location":"泰和 · 澄江学校","date":"1938 年","bg":"IMG-10","id":"chengjiang-grip-broom","type":"text","text":"小满攥紧扫帚，声音微微发颤，不敢相信。","next":"scene-069"},{"id":"scene-069","chapter":"第三章 · 文军长征","location":"泰和 · 澄江学校","date":"1938 年","bg":"IMG-10","type":"text","text":"真的？我也可以上学？","speaker":"小满","next":"scene-070"},{"id":"scene-070","chapter":"第三章 · 文军长征","location":"泰和 · 澄江学校","date":"1938 年","bg":"IMG-10","type":"text","text":"当然。竺校长之所以创办澄江学校，就是希望战火之中，孩子们也能有书可读。只要你愿意读书，就可以来。","speaker":"{name}","next":"chengjiang-hold-sleeve"},{"chapter":"第三章 · 文军长征","location":"泰和 · 澄江学校","date":"1938 年","bg":"IMG-10","id":"chengjiang-hold-sleeve","type":"text","text":"小满眼眶一下子红了，丢下扫帚，用力攥住你的衣袖。","next":"scene-071"},{"id":"scene-071","chapter":"第三章 · 文军长征","location":"泰和 · 澄江学校","date":"1938 年","bg":"IMG-10","type":"text","text":"我愿意！我一定会好好读书！","speaker":"小满","journal":{"id":"chengjiang-school","title":"孩童眼里的光","text":"1938 年，泰和。孩童眼里的光，是乱世中不灭的求学希望。"},"next":"scene-072"},{"id":"scene-072","chapter":"第三章 · 文军长征","location":"泰和","date":"1938 年夏","bg":"IMG-09","type":"text","text":"西迁途中，缺医少药。校长夫人张侠魂与次子竺衡感染痢疾，相继病殁。校长正在考察新校址的路上，没见到儿子的最后一面。","next":"scene-073"},{"id":"scene-073","chapter":"第三章 · 文军长征","location":"泰和","date":"1938 年夏","bg":"IMG-09","type":"text","text":"后来，竺校长捐出积蓄，设立“侠魂女士奖学金”，资助家境清寒、成绩优良的女生。","journal":{"id":"xia-hun","title":"侠魂","text":"1938 年夏，泰和。校长的夫人和二公子留在了这里。后来有个奖学金，叫侠魂女士奖学金。"},"next":"protect-branch"},{"id":"protect-branch","chapter":"第三章 · 文军长征","location":"泰和","date":"1938 年夏","bg":"IMG-09","type":"branch","text":"那些随校西行的古籍，也仍在路上。","condition":"protectBooks","yes":"protect-rain","no":"chapter4-start","next":null},{"id":"protect-rain","chapter":"第三章 · 文军长征 · 护书插叙","location":"押运途中 · 雨夜山路","date":"插叙 · 1939 年","bg":"IMG-03","type":"text","text":"插叙：1939 年，押运队继续西行。\n\n你曾报名护书。一个雨夜，独轮车陷进泥里，书箱上的遮布被风掀起。","next":"interaction-7"},{"id":"interaction-7","chapter":"第三章 · 文军长征 · 护书插叙","location":"押运途中 · 雨夜山路","date":"插叙 · 1939 年","bg":"IMG-03","type":"choice","text":"雨越来越大。应当如何先处理书箱？","choices":[{"id":"shelter","text":"先把书箱移到高处避雨","feedback":"你们先护住书箱，再设法把车推出泥地。书卷没有受潮。","effects":{"xinhuo":1,"bookIntegrity":1},"next":"scene-077"},{"id":"push","text":"先推车继续赶路","feedback":"车终于动了，一函书却已经受潮。你将它单独取出，交给保藏人员处理。","effects":{"bookIntegrity":0},"next":"scene-077"}],"next":"scene-077"},{"id":"scene-077","chapter":"第三章 · 文军长征 · 护书插叙","location":"押运途中 · 雨夜山路","date":"插叙 · 1939 年","bg":"IMG-03","type":"text","text":"这些书后来迁至贵阳地母洞。你记住了雨里抬起书箱的重量。\n\n插叙结束，故事回到 1938 年的迁校路上。","next":"chapter4-start"},{"id":"chapter4-start","chapter":"第四章 · 求是","location":"泰和 → 广西宜山","date":"1938 年 7—10 月","bg":"IMG-24","type":"text","text":"1938 年 7 月末，九江陷落。\n\n10 月，广州、武汉相继失守。","speaker":"字幕","next":"chapter4-he-narration"},{"chapter":"第四章 · 求是","location":"泰和 → 广西宜山","date":"1938 年 7—10 月","bg":"IMG-24","id":"chapter4-he-narration","type":"text","text":"七月九江丢了，泰和待不住。校长去广西看了地，全校迁宜山。水路旱路换着走，有的学生走了四十天。","next":"scene-079","speaker":"何九章"},{"id":"scene-079","chapter":"第四章 · 求是","location":"宜山 · 草棚大学","date":"1938 年 10—11 月","bg":"IMG-11","type":"text","text":"临时教室是草棚，夜里靠小油灯照明。有人站着听课，把小木板拴在腰间记笔记。疾病也跟着迁徙而来。","next":"scene-080"},{"id":"scene-080","chapter":"第四章 · 求是","location":"宜山 · 草棚大学","date":"1938 年 10—11 月","bg":"IMG-11","type":"text","text":"校医处只剩最后一支奎宁。陈砚秋烧得说胡话；排在你们前面的，还有个烧得同样厉害的一年级学生。","next":"choice-3"},{"id":"choice-3","chapter":"第四章 · 求是","location":"宜山 · 草棚大学","date":"1938 年 10—11 月","bg":"IMG-11","type":"choice","text":"你站在校医面前。最后一支药，要给谁？","choices":[{"id":"chen","text":"请求给陈砚秋","feedback":"你开口求校医：“她是我们一道修堤的。”前面同学看了看，让给了陈砚秋。她退了烧。三天后，你在转重症送县城的名单里听到了那个一年级学生的名字。","effects":{"renxin":1},"journal":{"id":"quinine","title":"认识的人","text":"我选了认识的人。这算不算错，我不知道。"},"next":"scene-082"},{"id":"queue","text":"按规矩，给排在前面的学生","feedback":"砚秋烧了一周，撑着来上堤防图纸课，没有提起这件事。","effects":{"qiuzhen":1},"journal":{"id":"quinine","title":"只问是非","text":"校长说，只问是非，不计利害。做起来比听起来难。"},"next":"scene-082"},{"id":"half","text":"建议拆半","feedback":"校医直接拒绝：“剂量不够，等于两个人都耽误。”你需要重新选择。","effects":{},"next":"choice-3"}],"next":"scene-082"},{"id":"scene-082","chapter":"第四章 · 求是","location":"宜山 · 开学典礼","date":"1938 年 11 月 1 日","bg":"IMG-12","type":"text","text":"新学期开学典礼上，竺可桢校长讲起王阳明，也讲起眼前的艰危。","next":"scene-083"},{"id":"scene-083","chapter":"第四章 · 求是","location":"宜山 · 开学典礼","date":"1938 年 11 月 1 日","bg":"IMG-12","type":"text","text":"今浙大以时局影响而侨江西，而入桂，正是蹑着先生的遗踪而来；这并不是偶然的事，我们正不应随便放过，而宜景慕体念，接受他那艰危中立身报国的伟大精神。","speaker":"竺可桢","next":"scene-084"},{"id":"scene-084","chapter":"第四章 · 求是","location":"宜山 · 开学典礼","date":"1938 年 11 月 1 日","bg":"IMG-12","type":"text","text":"求是精神，就是排万难、冒万死以求真知的精神。","speaker":"竺可桢","next":"interaction-8"},{"id":"interaction-8","chapter":"第四章 · 求是","location":"宜山 · 校务会议","date":"1938 年 11 月 19 日","bg":"IMG-12","type":"wordpick","text":"你作为学生记录员旁听。黑板上散落着八个字：求、是、力、行、敦、品、格、致。\n\n请依次选择两个字，写下浙大的校训。","next":"anthem-meeting-context"},{"chapter":"第四章 · 求是","location":"宜山 · 校务会议","date":"1938 年 11 月 19 日","bg":"IMG-12","id":"anthem-meeting-context","type":"text","text":"1938 年 11 月 19 日，校务会议定下校训，同时决定请马一浮撰写校歌歌词。","next":"scene-086"},{"id":"scene-086","chapter":"第四章 · 求是","location":"宜山 · 校务会议","date":"1938 年 11 月 19 日","bg":"IMG-12","type":"text","text":"校训有了，校歌还没有。请先生赐词。","speaker":"竺可桢","next":"scene-087"},{"id":"scene-087","chapter":"第四章 · 求是","location":"宜山 · 校务会议","date":"插叙 · 后来","bg":"IMG-12","type":"text","text":"后来——\n\n马一浮的词很快写成了：四言文言，一百四十八字，开篇是“大不自多，海纳江河”。\n\n竺校长喜欢它，也犯愁它——文理太深。","next":"scene-088"},{"id":"scene-088","chapter":"第四章 · 求是","location":"宜山 · 校务会议","date":"插叙 · 1941 年","bg":"IMG-12","type":"text","text":"1941 年 6 月，请国立音乐学院应尚能教授谱曲。\n\n同年 8 月 7 日，应教授谱曲完成寄回。","speaker":"字幕","next":"scene-089"},{"id":"scene-089","chapter":"第四章 · 求是","location":"宜山 · 校务会议","date":"插叙 · 1941 年","bg":"IMG-12","type":"text","text":"同年 11 月 10 日，在遵义举行纪念周时，竺校长请中文系郭斌龢教授讲解歌词，并由歌咏队员演唱一次，近 3 分钟，竺校长认为讲解和演唱均甚好。","speaker":"字幕","next":"scene-090"},{"id":"scene-090","chapter":"第四章 · 求是","location":"宜山 · 祠堂","date":"1938 年 11 月","bg":"IMG-12","type":"text","text":"回到 1938 年，宜山的祠堂里。\n\n你帮先生们抱着那摞文件出门。你不知道的是，你怀里的某一张纸，要等三年才唱得出声；而等它唱出声的那一天，这首歌会一直被唱到你来的那个年代——","next":"scene-091"},{"id":"scene-091","chapter":"第四章 · 求是","location":"宜山 · 祠堂","date":"1938 年 11 月","bg":"IMG-12","type":"text","text":"大不自多，海纳江河。惟学无际，际于天地。","speaker":"校歌","journal":{"id":"anthem","title":"三年后唱响的歌","text":"1938 年，马一浮先生为校歌作词。\n1941 年，校歌正式确定。大不自多，海纳江河。惟学无际，际于天地。"},"next":"scene-092"},{"id":"scene-092","chapter":"第四章 · 求是","location":"宜山 · 校舍废墟","date":"1939 年 2 月 5 日","bg":"IMG-13","type":"text","text":"警报骤响，众人奔向掩体。轰炸过后，教室、宿舍、礼堂都成了残垣。\n\n你从阅览室的废墟里扶出小满。","next":"scene-093"},{"id":"scene-093","chapter":"第四章 · 求是","location":"宜山 · 校舍废墟","date":"1939 年 2 月 5 日","bg":"IMG-13","type":"text","text":"何九章站在烧毁的钢琴前，捡起一枚琴键。往后，他的二胡成了全校的“乐队”。","next":"scene-094"},{"id":"scene-094","chapter":"第四章 · 求是","location":"宜山 · 校舍废墟","date":"1939 年 2 月 5 日","bg":"IMG-13","type":"text","text":"全校就这么一架琴。从上海跟着船，一路抬到宜山，没舍得丢。今天没了。","speaker":"何九章","next":"choice-4"},{"id":"choice-4","chapter":"第四章 · 求是","location":"宜山 · 校舍废墟","date":"1939 年 2 月 5 日","bg":"IMG-13","type":"choice","text":"校舍尽毁，有教授提议停课一月。你选择参与哪一件事？","choices":[{"id":"class","text":"露天复课，把黑板挂上榕树","feedback":"黑板挂到了榕树上。大家重新坐下，在树荫里继续上课。","effects":{"renxin":1},"next":"chapter5-start"},{"id":"field","text":"分组下乡，做灾情与田野记录","feedback":"你带着纸笔走进田野，把看到的灾情认真记下来。","effects":{"qiuzhen":1},"next":"chapter5-start"},{"id":"dorm","text":"先抢建宿舍","feedback":"你和同学先搭起住处。夜里，有人在新铺位上哭，你坐到他身边，陪了很久。","effects":{"xinhuo":1},"next":"chapter5-start"}],"next":"chapter5-start"},{"id":"chapter5-start","chapter":"第五章 · 东方剑桥","location":"宜山 → 遵义、湄潭","date":"1939 年 11 月—1940 年初","bg":"IMG-24","type":"text","text":"1939 年 11 月，南宁陷落。学校派人去遵义、云南建水勘察新校址。","speaker":null,"next":"audit-guizhou-hezhi"},{"chapter":"第五章 · 东方剑桥","location":"宜山 → 遵义、湄潭","date":"1939 年 11 月—1940 年初","bg":"IMG-24","id":"audit-guizhou-hezhi","type":"text","text":"南宁一丢，宜山也待不住了。这一回，去贵州。湄潭县的严县长带人在城门口接，把全县最好的房子都让给了我们。","next":"scene-097","speaker":"何九章"},{"id":"scene-097","chapter":"第五章 · 东方剑桥","location":"宜山 → 遵义、湄潭","date":"1939 年 11 月—1940 年初","bg":"IMG-24","type":"text","text":"学校总部迁到遵义，在湄潭设立分部，又在贵阳南青岩设一年级分校。\n\n从此，师生在黔北赢得了近七年相对稳定的办学时间。","next":"scene-098"},{"id":"scene-098","chapter":"第五章 · 东方剑桥","location":"遵义 · 何家巷学生宿舍","date":"1943 年前后","bg":"IMG-14","type":"text","text":"何家巷学生宿舍，夜。宿舍里是上下铺，你盘腿坐在床上，就着一盏桐油灯写作业。灯焰小，油烟重，宿舍里常年蒙着一层昏黄。","next":"interaction-9"},{"id":"interaction-9","chapter":"第五章 · 东方剑桥","location":"遵义 · 何家巷学生宿舍","date":"1943 年前后","bg":"IMG-14","type":"typo","text":"替《浙大日刊》的校样挑一个错字：\n\n“国难党头”\n\n请点击其中印错的字。","next":"scene-100"},{"id":"scene-100","chapter":"第五章 · 东方剑桥","location":"遵义 · 何家巷学生宿舍","date":"1943 年前后","bg":"IMG-14","type":"text","text":"做题做到一半，你打了个喷嚏——指节一抹，鼻孔两道黑。","next":"scene-101"},{"id":"scene-101","chapter":"第五章 · 东方剑桥","location":"遵义 · 何家巷学生宿舍","date":"1943 年前后","bg":"IMG-14","type":"text","text":"（笑）都一样，明早洗脸水都是黑的。","speaker":"对铺同学","next":"scene-102"},{"id":"scene-102","chapter":"第五章 · 东方剑桥","location":"遵义 · 何家巷学生宿舍","date":"1943 年前后","bg":"IMG-14","type":"text","text":"竺可桢校长推门进来。","next":"scene-103"},{"id":"scene-103","chapter":"第五章 · 东方剑桥","location":"遵义 · 何家巷学生宿舍","date":"1943 年前后","bg":"IMG-14","type":"text","text":"（小声）先生……","speaker":"{name}","next":"scene-104"},{"id":"scene-104","chapter":"第五章 · 东方剑桥","location":"遵义 · 何家巷学生宿舍","date":"1943 年前后","bg":"IMG-14","type":"text","text":"校长没有说话，在你床边看了很久那盏灯，又看了看你们揉眼睛的手。","next":"scene-105"},{"id":"scene-105","chapter":"第五章 · 东方剑桥","location":"遵义 · 何家巷学生宿舍","date":"1943 年前后","bg":"IMG-14","type":"text","text":"后来，校长请束星北、杨守珍两位教授改良植物油灯。铁香烟罐、玻璃灯罩和灯芯，让光焰更稳，也少了浓烟。\n\n设计完成后，费巩自己出资做了八百余盏，发给学生。","next":"interaction-10"},{"id":"interaction-10","chapter":"第五章 · 东方剑桥","location":"遵义 · 何家巷学生宿舍","date":"1943 年前后","bg":"IMG-14","type":"action","text":"几天后，总务处门口排起长队。你登记领到一盏灯，回到宿舍，把玻璃灯罩轻轻罩上。","button":"领取并点亮费巩灯","effects":{"renxin":1,"lampLit":true},"next":"scene-107"},{"id":"scene-107","chapter":"第五章 · 东方剑桥","location":"遵义 · 何家巷学生宿舍","date":"1943 年前后","bg":"IMG-14","type":"text","text":"火苗“呼”地立起来。宿舍四周的暗晕散开，桌上的字第一次这样清楚。","next":"scene-108"},{"id":"scene-108","chapter":"第五章 · 东方剑桥","location":"遵义 · 何家巷学生宿舍","date":"1943 年前后","bg":"IMG-14","type":"text","text":"亮堂吧？还没烟。听说费先生垫了自己好几个月的薪水。我们都叫它——费巩灯。","speaker":"对铺同学","journal":{"id":"lamp","title":"费巩灯","text":"1943 年，遵义。费先生给我们一人做了一盏灯。后来我才懂，他给自己留的，是黑。"},"next":"scene-109"},{"id":"scene-109","chapter":"第五章 · 东方剑桥","location":"湄潭 · 文庙","date":"1944 年","bg":"IMG-12","type":"text","text":"破庙里，基础课程与研究都没有停下来。李约瑟来到浙大访问，看见了艰苦条件下的学术空气。","next":"scene-110"},{"id":"scene-110","chapter":"第五章 · 东方剑桥","location":"湄潭 · 文庙","date":"1944 年","bg":"IMG-12","type":"text","text":"（望着文庙的破屋檐，笑了笑）\n\nChekiang University, one of the best four in China.\n\n——栖身破庙，却是中国最好的四所大学之一。","speaker":"李约瑟","journal":{"id":"cambridge","title":"东方剑桥","text":"1944 年，湄潭。我们是中国最好的四所大学之一。我把这句话抄在手账上，灯下看了一遍又一遍。"},"next":"scene-111"},{"id":"scene-111","chapter":"第五章 · 东方剑桥","location":"遵义 · 费巩办公室","date":"1945 年 3 月 · 出发前夜","bg":"IMG-15","type":"text","text":"费巩应邀赴重庆北碚复旦大学讲学。出发前夜，遵义。费巩在办公室收拾书稿，你帮他捆书。","next":"scene-112"},{"id":"scene-112","chapter":"第五章 · 东方剑桥","location":"遵义 · 费巩办公室","date":"1945 年 3 月 · 出发前夜","bg":"IMG-15","type":"text","text":"绳子捆紧些。书比人娇气，人淋了雨会干，书不会。","speaker":"费巩","next":"audit-fei-future-memory"},{"chapter":"第五章 · 东方剑桥","location":"遵义 · 费巩办公室","date":"1945 年 3 月 · 出发前夜","bg":"IMG-15","id":"audit-fei-future-memory","type":"text","text":"你拥有未来记忆——你知道他回不来了。","next":"choice-5"},{"id":"choice-5","chapter":"第五章 · 东方剑桥","location":"遵义 · 费巩办公室","date":"1945 年 3 月 · 出发前夜","bg":"IMG-15","type":"choice","text":"先生仍在收拾书稿。你要开口拦住他吗？","choices":[{"id":"stop","text":"拦他，把未来的事告诉他","feedback":"你把你知道的、将来会发生的一切，断断续续全说了。他一直没有打断你，只是把灯罩取下来，擦了擦，又装回去。","effects":{"xinhuo":1},"next":"fei-stop"},{"id":"silent","text":"不拦，替他提起箱子","feedback":"你几次想开口，最终什么都没说。他捆好最后一道绳，直起身，看见你还站着。","effects":{"qiuzhen":1},"next":"fei-silent"}],"next":"fei-stop"},{"id":"fei-stop","chapter":"第五章 · 东方剑桥","location":"遵义 · 费巩办公室","date":"1945 年 3 月 · 出发前夜","bg":"IMG-15","type":"text","text":"你说的事，我信一半。但讲学是我的事。北碚的学生等着我——就像当年你们等着这盏灯。灯做好了，没有不送出去的道理。","speaker":"费巩","next":"fei-gone"},{"id":"fei-silent","chapter":"第五章 · 东方剑桥","location":"遵义 · 费巩办公室","date":"1945 年 3 月 · 出发前夜","bg":"IMG-15","type":"text","text":"还有事？","speaker":"费巩","next":"audit-fei-lift-case"},{"chapter":"第五章 · 东方剑桥","location":"遵义 · 费巩办公室","date":"1945 年 3 月 · 出发前夜","bg":"IMG-15","id":"audit-fei-lift-case","type":"text","text":"你摇摇头，替他提起箱子。","next":"audit-fei-silent-reply"},{"chapter":"第五章 · 东方剑桥","location":"遵义 · 费巩办公室","date":"1945 年 3 月 · 出发前夜","bg":"IMG-15","id":"audit-fei-silent-reply","type":"text","text":"（笑了笑）回来给你们讲北碚的事。灯下读书，别凑太近。","next":"fei-gone","speaker":"费巩"},{"id":"fei-gone","chapter":"第五章 · 东方剑桥","location":"重庆 · 千厮门码头","date":"1945 年 3 月 5 日","bg":"IMG-15","type":"text","text":"3 月 5 日凌晨，千厮门码头。寻遍渡船，不见先生……\n\n校长四处查问，学生罢课抗议，营救无果。","journal":{"id":"farewell-fei","title":"光是留给我们的","text":"1945.3.4 夜，遵义。我送费先生到校门口。灯是他送的，光是留给我们的。"},"next":"scene-117"},{"id":"scene-117","chapter":"第五章 · 东方剑桥","location":"湄潭 · 夜街","date":"1945 年 8 月","bg":"IMG-16","type":"text","text":"1945 年 8 月，日本投降的消息传到湄潭。\n\n夜里，文庙的费巩灯还亮着，街那头忽然炸开一挂鞭炮，接着是第二挂、第三挂，整条街的狗都叫起来。","next":"scene-118"},{"id":"scene-118","chapter":"第五章 · 东方剑桥","location":"湄潭 · 夜街","date":"1945 年 8 月","bg":"IMG-16","type":"text","text":"你和同学举着灯冲出门，街上已经全是人——有人哭，有人笑，有人把洗脸盆敲得山响。一个教授站在人堆里，一遍遍地说“胜利了”，声音是哑的。","next":"scene-119"},{"id":"scene-119","chapter":"第五章 · 东方剑桥","location":"湄潭 · 夜街","date":"1945 年 8 月","bg":"IMG-16","type":"text","text":"湄潭镇子的灯一盏一盏亮起来，文庙、祠堂、民居，漫山遍野的火光，像八年前梅城码头的那批箱灯，终于被一盏一盏重新点亮。\n\n你在人群里走。","next":"scene-120"},{"id":"scene-120","chapter":"第五章 · 东方剑桥","location":"湄潭 · 夜街","date":"1945 年 8 月","bg":"IMG-16","type":"text","text":"你还记得天目山吗？那年钟声和炮声一起响。现在好了，书一页不少，人也都在。","speaker":"何九章","next":"scene-121"},{"id":"scene-121","chapter":"第五章 · 东方剑桥","location":"湄潭 · 夜街","date":"1945 年 8 月","bg":"IMG-16","type":"text","text":"灯还点吗？","speaker":"小满","next":"scene-122"},{"id":"scene-122","chapter":"第五章 · 东方剑桥","location":"湄潭 · 夜街","date":"1945 年 8 月","bg":"IMG-16","type":"text","text":"点。路还长。","speaker":"{name}","next":"scene-123"},{"id":"scene-123","chapter":"第五章 · 东方剑桥","location":"湄潭 · 夜街","date":"1945 年 8 月","bg":"IMG-16","type":"text","text":"1945 年 8 月，抗战胜利。自杭州沦陷、浙大师生出走，已近八年。\n\n来时 2600 多公里，师生行李之外，是 140 箱《四库全书》、两三百箱图书仪器。它们都还在。","speaker":"字幕","next":"scene-124"},{"id":"scene-124","chapter":"第五章 · 东方剑桥","location":"湄潭 · 夜街","date":"1945 年 9 月 5 日","bg":"IMG-16","type":"text","text":"9 月 5 日，竺可桢与家人在遵义中正桥边留影。","speaker":"字幕","next":"chapter6-start"},{"id":"chapter6-start","chapter":"终章 · 走马灯与回答","location":"杭州 · 大学路校舍","date":"1946 年 5—6 月","bg":"IMG-17","type":"text","text":"1945 年 10 月，龙泉分校师生率先返杭。1946 年 5 月 7 日，遵义总校启程。\n\n别兮，遵义。","next":"interaction-11"},{"id":"interaction-11","chapter":"终章 · 走马灯与回答","location":"杭州 · 大学路校舍","date":"1946 年 5—6 月","bg":"IMG-17","type":"action","text":"大学路校舍断墙残垣。你踩着凳子，托起“国立浙江大学”的木牌。","button":"挂正校牌","next":"scene-127"},{"id":"scene-127","chapter":"终章 · 走马灯与回答","location":"杭州 · 大学路校舍","date":"1946 年 5—6 月","bg":"IMG-17","type":"text","text":"木牌终于挂正。1946 年的夏夜，你独自走过校园。\n\n白光渐起——你要回去了。","next":"montage"},{"id":"montage","chapter":"终章 · 走马灯与回答","location":"杭州 · 大学路校舍","date":"1946 年 5—6 月","bg":"IMG-17","type":"montage","text":"走过的路，像手账里的书页，一页页翻回来。","next":"ending"},{"id":"ending","chapter":"终章 · 走马灯与回答","location":"杭州 · 大学路校舍","date":"1946 年 5—6 月","bg":"IMG-17","type":"ending","text":"白光里，何九章向你走来。","next":"audit-farewell-chase"},{"chapter":"终章 · 走马灯与回答","location":"杭州 · 大学路校舍","date":"1946 年 5—6 月","bg":"IMG-17","id":"audit-farewell-chase","type":"text","text":"白光中，何九章追出来。","next":"scene-130"},{"id":"scene-130","chapter":"终章 · 走马灯与回答","location":"杭州 · 大学路校舍","date":"1946 年 5—6 月","bg":"IMG-17","type":"text","text":"你老说你是从以后来的。那以后——我们赢了吗？","speaker":"何九章","next":"scene-131"},{"id":"scene-131","chapter":"终章 · 走马灯与回答","location":"杭州 · 大学路校舍","date":"1946 年 5—6 月","bg":"IMG-17","type":"text","text":"赢了。你们做的事，八十九年后还有人记得。","speaker":"{name}","next":"scene-132"},{"id":"scene-132","chapter":"终章 · 走马灯与回答","location":"此后的时间","date":"1946—1998","bg":"IMG-24","type":"text","text":"1946 年 6 月，国立浙江大学复员杭州。","speaker":"时间轴","next":"scene-133"},{"id":"scene-133","chapter":"终章 · 走马灯与回答","location":"此后的时间","date":"1946—1998","bg":"IMG-24","type":"text","text":"1949 年 5 月 3 日，杭州解放。竺可桢卸任校长，北上出任中国科学院副院长。","speaker":"时间轴","next":"scene-134"},{"id":"scene-134","chapter":"终章 · 走马灯与回答","location":"此后的时间","date":"1946—1998","bg":"IMG-24","type":"text","text":"1952 年，全国院系调整。浙大的院系散入多所高校。","speaker":"时间轴","next":"scene-135"},{"id":"scene-135","chapter":"终章 · 走马灯与回答","location":"此后的时间","date":"1946—1998","bg":"IMG-24","type":"text","text":"1988 年 5 月 5 日，校务会议决定：校训在“求是”之后，添上“创新”二字。","speaker":"时间轴","next":"scene-136"},{"id":"scene-136","chapter":"终章 · 走马灯与回答","location":"此后的时间","date":"1946—1998","bg":"IMG-24","type":"text","text":"1998 年 9 月，浙江大学、杭州大学、浙江农业大学、浙江医科大学合并，新的浙江大学诞生。","speaker":"时间轴","next":"scene-137"},{"id":"scene-137","chapter":"终章 · 走马灯与回答","location":"紫金港校史馆","date":"2026 年 10 月","bg":"IMG-01","type":"text","text":"你趴在展柜前惊醒。窗外是 2026 年的阳光，展厅里安静得能听见空调声。","next":"scene-138"},{"id":"scene-138","chapter":"终章 · 走马灯与回答","location":"紫金港校史馆","date":"2026 年 10 月","bg":"IMG-01","type":"text","text":"（声音远远传来）……浙大西迁，行程 2600 多公里，历时八年多……","speaker":"讲解员","next":"scene-139"},{"id":"scene-139","chapter":"终章 · 走马灯与回答","location":"紫金港校史馆","date":"2026 年 10 月","bg":"IMG-01","type":"text","text":"你低下头，手里还攥着那本手账。翻开，里面是这一路写下的所有记录。","next":"scene-140"},{"id":"scene-140","chapter":"终章 · 走马灯与回答","location":"紫金港校史馆","date":"2026 年 10 月","bg":"IMG-01","type":"text","text":"原来不是梦。他们在破庙里点的灯，真的亮到了今天。","speaker":"{name}","next":"scene-141"},{"id":"scene-141","chapter":"终章 · 走马灯与回答","location":"紫金港校史馆","date":"2026 年 10 月","bg":"IMG-01","type":"text","text":"竺校长当年问了浙大人两个问题：到浙大来做什么？将来毕业后要做什么样的人？\n\n八十九年前，他们用 2600 多公里回答了一遍。现在，轮到我了。","speaker":"{name}","next":"reflection"},{"id":"reflection","chapter":"终章 · 走马灯与回答","location":"紫金港校史馆","date":"2026 年 10 月","bg":"IMG-01","type":"reflection","text":"把你的回答写在手账的最后一页。","next":null}],"endings":{"qiushi":{"title":"真结局 · 求是","text":"何九章：“先生们让我送你一句话——你这趟没白来。书在，人在，‘是’也在。”\n\n他把灯放进你手里：“带走吧，它认你。”\n\n白光起时，你听见全队列队唱校歌，唱的是送别的调子。"},"library":{"title":"藏书楼","text":"何九章：“你啊，一路尽顾着替别人扛东西了。”\n\n他塞给你一张收条——泰和侠魂基金那张的摹本：“书都到家了，你放心。”"},"chengjiang":{"title":"澄江","text":"何九章展开一卷纸：是泰和大堤的图，堤上刻着密密麻麻的名字，最末一个空着。\n\n他把笔递给你：“这个位置，给你留的。”"},"lamp":{"title":"湄潭灯","text":"何九章：“先生们说，你的笔记比课代表还全。”\n\n他指给你看——文庙窗前一盏盏灯次第点亮：“看吧，这都是你们这样的人，一盏一盏传下来的。”"},"anonymous":{"title":"隐没 · 无名","text":"走马灯放到一半，画面忽然褪成灰白，人影一个个淡去。何九章的声音很远：“……怪了，我怎么记不起你的脸了？”\n\n白光里只剩那本手账，纸页上字迹模糊，唯独“求是”二字还清晰。"}}}</script>
<script id="game-core">/* Pure game rules, shared by the browser and the verification script. */
(function(global) {
  'use strict';
  function normalizeName(value) { return Array.from(String(value || '').replace(/[<>\[\]{}\r\n\t]/g, '').trim()).slice(0, 10).join('') || '江潮生'; }
  function createInitialState(name) {
    return {name:normalizeName(name), nodeId:'start', renxin:0, xinhuo:0, qiuzhen:0,
      protectBooks:false, bookIntegrity:null, mistakes:0, lampLit:false,
      journal:[], completedActions:[], visitedExhibits:[], ending:null};
  }
  function applyEffect(state, effects) {
    for (const [key,value] of Object.entries(effects || {})) {
      if (['renxin','xinhuo','qiuzhen','mistakes'].includes(key)) state[key] += Number(value) || 0;
      else if (['protectBooks','bookIntegrity','lampLit'].includes(key)) state[key] = value;
    }
    return state;
  }
  function recordJournal(state, entry) {
    if (entry && !state.journal.some(item => item.id === entry.id)) state.journal.push({...entry});
  }
  function applyOnce(state,key,effects,journal) {
    if (state.completedActions.includes(key)) return false;
    state.completedActions.push(key); applyEffect(state,effects); recordJournal(state,journal); return true;
  }
  function resolveEnding(s) {
    if (s.mistakes >= 3) return 'anonymous';
    const values=[s.renxin,s.xinhuo,s.qiuzhen];
    if (s.protectBooks && s.bookIntegrity === 1 && Math.max(...values)-Math.min(...values)<=2) return 'qiushi';
    if (s.renxin>=s.xinhuo && s.renxin>=s.qiuzhen) return 'library';
    if (s.xinhuo>=s.qiuzhen) return 'chengjiang';
    return 'lamp';
  }
  global.QiushiCore=Object.freeze({normalizeName,createInitialState,applyEffect,recordJournal,applyOnce,resolveEnding});
})(globalThis);
</script>

const $=id=>document.getElementById(id);
const content=$('content'), controls=$('controls'), notice=$('notification');
const chapterNames=['序章 · 照片里的录取','第一章 · 烽火开学','第二章 · 夜渡钱塘','第三章 · 文军长征','第四章 · 求是','第五章 · 东方剑桥','终章 · 走马灯与回答'];
const names={'IMG-01':'校史馆','IMG-02':'杭州校门','IMG-03':'西迁山路','IMG-04':'禅源寺','IMG-05':'建德梅城','IMG-06':'古籍仓房','IMG-07':'学生宿舍','IMG-08':'白鹭洲书院','IMG-09':'赣江大堤','IMG-10':'澄江学校','IMG-11':'宜山草棚大学','IMG-12':'校务会议','IMG-13':'宜山废墟','IMG-14':'遵义宿舍','IMG-15':'遵义办公室','IMG-16':'湄潭夜街','IMG-17':'返杭校门','IMG-24':'西迁路线图','IMG-26':'费巩灯'};
function text(value){return String(value||'').replaceAll('{name}',state.name);}
function el(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=text(value);return e;}
function btn(label,fn,cls='choice') {const b=el('button',cls,label);b.type='button';const version=pageVersion;b.addEventListener('click',()=>{if(version===pageVersion&&!b.disabled)fn(b);});return b;}
function clearTimer(){if(timer){clearInterval(timer);timer=null;}}
function clearView(){pageVersion++;content.replaceChildren();controls.replaceChildren();notice.textContent='';}
function setScene(n,overrideBg){const requestedBg=overrideBg||n.bg||'IMG-01';const bg=requestedBg==='IMG-25'?'IMG-07':requestedBg;const image=$('scene-image');const src='./assets/images/'+bg+'.webp';if(image.getAttribute('src')!==src)image.src=src;
image.alt=(names[bg]||n.location||'西行')+'场景示意图';image.className='scene-image';
if(bg==='IMG-14')image.classList.add(state.lampLit?'lit':'night');
if(/夜|暮|雨/.test(String(n.location||'')+' '+String(n.date||''))&&bg!=='IMG-14')image.classList.add('night');
$('location').firstChild.textContent=n.location||names[bg]||'西行途中';$('scene-date').textContent=n.date||'';$('chapter-label').textContent=n.chapter||'';
$('lamp-object').hidden=!(bg==='IMG-14'&&state.lampLit);$('map-caption').hidden=bg!=='IMG-24';$('map-caption').textContent=n.id==='chapter3-start'?'建德 · 金华 · 南昌 · 樟树 · 吉安':'杭州 · 天目山 · 建德 · 吉安 · 泰和 · 宜山 · 遵义／湄潭';
$('school-sign').hidden=n.id!=='interaction-11';$('school-sign').classList.toggle('settled',state.completedActions.includes('action:interaction-11'));
$('scene').classList.remove('flash','quake');if(n.id==='scene-005'){void $('scene').offsetWidth;$('scene').classList.add('flash');}
if(n.id==='scene-092'||(bg==='IMG-13'&&n.id.includes('bomb'))) {void $('scene').offsetWidth;$('scene').classList.add('quake');}}
$('scene-image').addEventListener('error',function(){this.style.opacity='.35';});$('scene-image').addEventListener('load',function(){this.style.opacity='1';});
function writeText(n){if(n.speaker)content.append(el('p','speaker',n.speaker==='你'?(nameConfirmed?state.name:'你'):n.speaker));const p=el('p','story-text',n.text);p.tabIndex=-1;content.append(p);}
function apply(key,effects,journal){const changed=C.applyOnce(state,key,effects,journal);if(changed&&journal)notice.textContent='已写入手账 · '+text(journal.title);return changed;}
function continueButton(next,label='继续 →'){const b=btn(label,()=>go(next),'continue');b.dataset.advance='true';controls.append(b);return b;}
function feedback(message,next){pageVersion++;controls.replaceChildren();const box=el('div','feedback',message);box.setAttribute('role','status');controls.append(box);continueButton(next);}
function go(id){clearTimer();if(!id){showReflection();return;}let n=nodes.get(id);let limit=0;while(n&&n.type==='branch'){if(++limit>20)throw Error('剧情分支循环');id=state[n.condition]?n.yes:n.no;n=nodes.get(id);}if(!n)throw Error('未找到剧情节点：'+id);
playing=true;state.nodeId=n.id;current=n;clearView();document.body.dataset.node=n.id;document.body.dataset.type=n.type||'text';setScene(n);
$('reading-hint').textContent='点击继续 · 空格推进';
if(n.type!=='action')apply('enter:'+n.id,n.effects,n.journal);
if(n.type==='montage'){showMontage(n);return;}if(n.type==='ending'){showEnding(n);return;}if(n.type==='reflection'){showReflection(n);return;}
writeText(n);
switch(n.type){
case 'exhibits':showExhibits(n);break;
case 'choice':for(const option of n.choices){const b=btn(option.text,()=>{apply('choice:'+n.id+':'+option.id,option.effects,option.journal);if(option.feedback)feedback(option.feedback,option.next||n.next);else go(option.next||n.next);});b.dataset.choice=option.id;controls.append(b);}break;
case 'action':{const b=btn(n.button||'继续',()=>{apply('action:'+n.id,n.effects,n.journal);if(n.effects&&n.effects.lampLit){setScene(n);feedback('灯亮起来了。书页上的字，终于清清楚楚。',n.next);}else if(n.id==='interaction-11'){setScene(n);feedback('你扶住木牌，轻轻将它挂正。国立浙江大学。',n.next);}else go(n.next);});b.dataset.action=n.id;controls.append(b);break;}
case 'nameConfirm':showNameConfirm(n);break;
case 'quiz':showQuiz(n);break;
case 'wordpick':showWords(n);break;
case 'typo':showTypo(n);break;
default:continueButton(n.next);
}
}
function showTitle(){clearTimer();playing=false;current=null;nameConfirmed=false;state=C.createInitialState();if($('name-dialog').open)$('name-dialog').close();clearView();document.body.dataset.node='title';document.body.dataset.type='title';setScene({location:'紫金港 · 校史馆',date:'2026 年 10 月',chapter:'一段西行，八十九年的回响',bg:'IMG-01'});
content.append(el('p','title-kicker','浙江大学西迁 · 历史互动故事'),el('h1','game-title','求是西行'),el('p','title-description','1937—1946。从校史馆的一张旧地图，走进一所大学的西行岁月。\n读他们的故事，作出你的选择，把一路的回答写进手账。'));
content.append(el('p','field-note','本局进度不会保存，刷新页面将重新开始。'));
const start=btn('开始西行 →',()=>{state=C.createInitialState();go('start');});start.id='start-game';controls.append(start);$('reading-hint').textContent='上图下文 · 点击选项继续故事';}
function showNameConfirm(n){
const dialog=$('name-dialog');
function openName(){
dialog.replaceChildren();
const heading=el('h2','', '我的名字是');heading.id='name-title';
const form=el('form');form.id='name-form';
const label=el('label','name-label','你的名字');label.htmlFor='player-name';
const input=el('input','name-input');input.id='player-name';input.maxLength=10;input.autocomplete='off';input.placeholder='江潮生';input.value=nameConfirmed?state.name:'';
const submit=el('button','choice','确认姓名，回答何九章');submit.type='submit';
const actions=el('div','controls');actions.append(submit);
form.append(label,input,el('p','field-note','最多十个字；留空使用“江潮生”。'),actions);
form.addEventListener('submit',event=>{event.preventDefault();if(current!==n)return;state.name=C.normalizeName(input.value);nameConfirmed=true;dialog.close();go(n.next);});
dialog.append(heading,form);dialog.showModal();input.focus();
}
controls.append(btn('填写并确认姓名',openName));$('reading-hint').textContent='确认姓名后，继续与何九章交谈';openName();
}
function showExhibits(n){const items=[['suitcase','西迁的箱子','竺可桢西迁时随身带的箱子。'],['photo','十二人的合影','1937 年，刘奎斗等 12 位投笔从戎学生的合影。\n他们投笔从戎，保家卫国。'],['diary','日记的手稿','他记了一辈子日记，直到去世前一天。'],['map','护送路线图','2600 多公里，没有一天停止办学。']];
const info=el('div','exhibit-info','先看看三件展品，再展开护送路线图。');info.setAttribute('role','status');content.append(info);
function draw(){controls.replaceChildren();for(const [id,label,description] of items){const seen=state.visitedExhibits.includes(id);const b=btn(label+(seen?'　已查看':''),()=>{if(!state.visitedExhibits.includes(id))state.visitedExhibits.push(id);info.textContent=description;if(id==='map'){setScene({...n,location:'护送路线图'},'IMG-24');pageVersion++;controls.replaceChildren();continueButton(n.next,'触碰地图上的杭州 →');}else draw();});b.id='exhibit-'+id;b.disabled=id==='map'&&state.visitedExhibits.length<3;controls.append(b);}}draw();}
function showQuiz(n){const form=el('form');form.id='night-quiz';for(const [i,q] of n.questions.entries()){const field=el('fieldset','question');field.append(el('legend','',(i+1)+'．'+q.question));q.options.forEach((option,j)=>{const label=el('label','answer');const radio=el('input');radio.type='radio';radio.name='question-'+i;radio.value=String(j);radio.id='quiz-'+i+'-'+j;label.append(radio,el('span','',option));field.append(label);});form.append(field);}controls.append(form);
const submit=btn('提交这三题',()=>{const correct=n.questions.every((q,i)=>Number(new FormData(form).get('question-'+i))===q.correct);apply('quiz:'+n.id,correct?{qiuzhen:1}:{mistakes:1});const answers=n.questions.map((q,i)=>(i+1)+'．'+q.options[q.correct]).join('\n');feedback(correct?'三道题都答对了。你合上书，记住了这一路的来处。':'何九章（嘲讽）：“白鹭洲是文天祥读过书的地方，你给我考成这样？”\n\n这一次，记住这些答案：\n'+answers,n.next);});submit.disabled=true;submit.id='submit-quiz';form.addEventListener('submit',e=>e.preventDefault());form.addEventListener('change',()=>{submit.disabled=!n.questions.every((_,i)=>form.querySelector('input[name="question-'+i+'"]:checked'));});controls.append(submit);}
function showWords(n){let selected=[];const selectedLine=el('p','selected-words','已选：等待你的两个字');const grid=el('div','word-grid');const wordButtons=[];const submit=btn('确认这两个字',()=>{const right=selected.join('')==='求是';apply('wordpick:'+n.id,right?{xinhuo:1}:{mistakes:1},right?null:{id:'motto-reason',title:'选择的依据',text:'我想用这两个字提醒自己继续读书做事，但选择也应当有依据。'});feedback(right?'全场静默三秒，竺可桢说：“记下吧。”':'竺可桢没有否定你，只问：“你选这两个字，依据是什么？”\n你把自己的想法记进了手账。',n.next);});submit.disabled=true;submit.id='submit-words';
for(const char of ['求','是','力','行','敦','品','格','致']){const b=btn(char,()=>{if(selected.includes(char))selected=selected.filter(x=>x!==char);else if(selected.length<2)selected.push(char);selectedLine.textContent='已选：'+(selected.join('　')||'等待你的两个字');wordButtons.forEach(x=>x.setAttribute('aria-pressed',String(selected.includes(x.textContent))));submit.disabled=selected.length!==2;},'word');b.setAttribute('aria-pressed','false');wordButtons.push(b);grid.append(b);}controls.append(selectedLine,grid,submit);}
function showTypo(n){const grid=el('div','word-grid');for(const char of ['国','难','党','头']){const b=btn(char,()=>{const right=char==='党';apply('typo:'+n.id,right?{qiuzhen:1}:{mistakes:1});feedback(right?'是“党”字。应当写作“国难当头”。':'这一处应将“党”改成“当”：国难当头。\n油灯的光太暗，你揉了揉眼睛。',n.next);},'word');grid.append(b);}controls.append(grid);}
function showMontage(n){state.ending=C.resolveEnding(state);let index=0;const memories=[['IMG-04','天目山 · 禅源寺','1937.9.27 天目山禅源寺。一座庙，开学的钟声和远处的炮声一起响。'],['IMG-06','建德 · 文脉西运','1937.11 建德梅城。警报声声，我们躲着战火，捧着古书，要把文脉一路护往内地。'],['IMG-09','泰和 · 赣江大堤','1938 年，泰和。赣江边跑测量，一寸一尺，修的是保命的大堤。'],['IMG-14','遵义 · 费巩灯','1943 年，遵义。费先生给我们一人做了一盏灯。后来我才懂，他给自己留的，是黑。'],['IMG-16','湄潭 · 胜利的灯火','灯还点吗？\n点。路还长。']];
function frame(){clearView();const [bg,location,body]=memories[index];setScene({...n,location},bg);$('scene-image').classList.add(state.ending==='anonymous'&&index>=2?'faded':'memory');content.append(el('p','speaker','走马灯 · '+(index+1)+' / 5'),el('p','story-text',body));if(index===4)content.append(el('p','exhibit-info',state.protectBooks&&state.bookIntegrity===1?'那些书，最终到了安全的地方。':'仍有人继续护送书卷西行。'));controls.append(btn('跳过回顾，继续告别 →',()=>go(n.next),'continue'));$('reading-hint').textContent='回忆会自动翻页 · 可随时跳过';}
frame();timer=setInterval(()=>{if(document.hidden||document.querySelector('dialog[open]'))return;index++;if(index>=memories.length)go(n.next);else frame();},7000);}
function showEnding(n){state.ending=C.resolveEnding(state);const ending=story.endings[state.ending];document.body.dataset.ending=state.ending;content.append(el('p','title-kicker','这一程，你的回答'),el('h1','ending-title',ending.title),el('p','story-text',ending.text),el('p','ending-meta','人心 '+state.renxin+'　／　薪火 '+state.xinhuo+'　／　求真 '+state.qiuzhen));if(state.ending==='anonymous')$('scene-image').classList.add('faded');continueButton(n.next,'走向告别 →');}
function showReflection(n){clearTimer();if(n){content.replaceChildren();controls.replaceChildren();writeText(n);}else{clearView();setScene({bg:'IMG-01',location:'紫金港 · 校史馆',date:'2026 年 10 月',chapter:'终章 · 回到此刻'});content.append(el('p','story-text','他们在破庙里点的灯，真的亮到了今天。现在，轮到你了。'));}
for(const [i,question] of ['到浙大来做什么？','将来毕业后要做什么样的人？'].entries()){const label=el('label','reflection-label',question);label.htmlFor='reflection-'+i;const input=el('textarea','reflection-input');input.id='reflection-'+i;input.maxLength=1000;input.placeholder='写下此刻的回答，也可以留白。';label.append(input);content.append(label);}content.append(el('p','field-note','回答只留在当前页面，不上传，也不保存。'),el('p','ending-title','求是')); controls.append(btn('翻开这一程的手账',openJournal),btn('回到标题，重新启程',()=>showDialog('restart-dialog')));$('reading-hint').textContent='旅程完结 · 求是';}
function showDialog(id){$(id).showModal();}
function openJournal(){const root=$('journal-content');root.replaceChildren(el('p','journal-summary',(nameConfirmed?state.name:'未署名')+'的手账\n人心 '+state.renxin+'　薪火 '+state.xinhuo+'　求真 '+state.qiuzhen));if(!state.journal.length)root.append(el('p','empty','纸页还是空的。走进故事，让经历慢慢留下字迹。'));for(const entry of state.journal){const block=el('article','journal-entry');block.append(el('h3','',entry.title),el('p','',entry.text));root.append(block);}showDialog('journal-dialog');}
$('journal-button').addEventListener('click',openJournal);$('chapters-button').addEventListener('click',()=>{const root=$('chapters-content');root.replaceChildren(el('p','journal-summary','地图上的地名，曾是一所大学的课堂。章节按故事顺序展开。'));const list=el('ol','chapter-list');const actual=current?current.chapter:'';chapterNames.forEach(name=>{const li=el('li',name===actual?'current':'',name);list.append(li);});root.append(list);showDialog('chapters-dialog');});
$('restart-button').addEventListener('click',()=>playing?showDialog('restart-dialog'):showTitle());$('cancel-restart').addEventListener('click',()=>$('restart-dialog').close());$('confirm-restart').addEventListener('click',()=>{$('restart-dialog').close();delete document.body.dataset.ending;showTitle();window.scrollTo({top:0,behavior:'instant'});});document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).close()));
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||['INPUT','TEXTAREA','BUTTON','SELECT'].includes(document.activeElement.tagName))return;if(e.code==='Space'||e.code==='ArrowRight'){const b=controls.querySelector('[data-advance]');if(b){e.preventDefault();b.click();}}});
showTitle();
})();
</script>
</body>
</html>

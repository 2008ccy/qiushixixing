<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文本区分测试</title>
<style>
  body {
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fafafa;
    color: #333;
  }

  /* 背景描述：最淡，小一号，左侧细线 */
  .desc {
    color: #9a9a9a;
    font-size: 0.9em;
    line-height: 1.8;
    border-left: 3px solid #ddd;
    padding-left: 12px;
    margin: 12px 0;
  }

  /* 旁白：斜体，中灰 */
  .narration {
    color: #777;
    font-style: italic;
    line-height: 1.9;
    margin: 16px 0;
  }

  /* 对话块：左侧粗色条 + 角色名 */
  .dialogue {
    margin: 18px 0;
    padding-left: 14px;
    border-left: 4px solid #bbb;
  }

  .dialogue .speaker {
    display: block;
    font-weight: bold;
    font-size: 0.85em;
    letter-spacing: 1px;
    margin-bottom: 4px;
    color: #555;
  }

  .dialogue .line {
    margin: 0;
    color: #333;
    line-height: 1.8;
  }

  .dialogue[data-char="lin"] { border-left-color: #e07a5f; }
  .dialogue[data-char="lin"] .speaker { color: #e07a5f; }

  .dialogue[data-char="me"] { border-left-color: #3d7ea6; }
  .dialogue[data-char="me"] .speaker { color: #3d7ea6; }

  /* 史实卡片 */
  .history-note {
    margin: 32px 0;
    padding: 16px 18px;
    background: #f6f3ec;
    border-left: 5px solid #8b6f47;
    border-radius: 4px;
    font-family: "Songti SC", "SimSun", serif;
    color: #3a332a;
    line-height: 1.9;
  }

  .history-label {
    display: inline-block;
    font-family: sans-serif;
    font-size: 0.75em;
    letter-spacing: 2px;
    color: #fff;
    background: #8b6f47;
    padding: 2px 8px;
    border-radius: 3px;
    margin-bottom: 8px;
  }

  .history-note p {
    margin: 0 0 8px;
  }

  .history-note cite {
    display: block;
    font-size: 0.8em;
    color: #8a7f6e;
    font-style: normal;
    text-align: right;
  }
</style>
</head>
<body>

  <p class="desc">傍晚的教室，夕阳把桌椅染成橘色。</p>

  <div class="dialogue" data-char="lin">
    <span class="speaker">林晓</span>
    <p class="line">“你还没走？”</p>
  </div>

  <p class="narration">我抬起头，窗外的云正慢慢散开。</p>

  <div class="dialogue" data-char="me">
    <span class="speaker">我</span>
    <p class="line">“马上就走。”</p>
  </div>

  <aside class="history-note">
    <span class="history-label">史实</span>
    <p>前206年，项羽于鸿门设宴款待刘邦。范增多次示意项羽杀刘邦，项羽犹豫未决。刘邦借如厕之机逃走。</p>
    <cite>——《史记·项羽本纪》</cite>
  </aside>

</body>
</html>
